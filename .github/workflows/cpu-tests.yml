name: CPU protocol tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==8.4.2 numpy==2.2.6 scipy==1.15.3 PyYAML==6.0.2
      - run: python -m pytest -q
      - run: python -m src.evaluate --help && python -m src.stats --help
