name: CPU protocol tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==9.1.1 numpy==2.3.5 scipy==1.18.1 PyYAML==6.0.3 math-verify==0.9.0
      - run: python -m pytest -q
      - run: python -m src.evaluate --help && python -m src.stats --help
